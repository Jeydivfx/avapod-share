<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آواپاد - اشتراک‌گذاری پادکست</title>d
  <!-- استفاده از فونت وزیر از CDN -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    /* استایل‌های صفحه */
    body {
      background-color: #0A0A0A;
      color: #FFFFFF;
      font-family: 'Vazirmatn', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      direction: rtl;
      text-align: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background-color: #1A1A1A;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }
    .cover {
      width: 120px;
      height: 120px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 16px;
      border: 2px solid #333;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .artist {
      font-size: 14px;
      color: #999;
      margin-bottom: 10px;
    }
    .desc {
      font-size: 14px;
      color: #ccc;
      line-height: 1.7;
      margin-bottom: 20px;
      text-align: justify;
      padding: 0 10px;
    }
    .badge {
      display: inline-block;
      background-color: #4A90E2;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .share-btn {
      display: inline-block;
      background-color: #4A90E2;
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      transition: background-color 0.2s;
    }
    .share-btn:hover {
      background-color: #357ABD;
    }
    /* استایل دکمه‌های شبکه‌های اجتماعی */
    .social-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }
    .social-buttons a {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 30px;
      color: white;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .social-buttons a:hover {
      opacity: 0.8;
    }
    .whatsapp { background-color: #25D366; }
    .telegram { background-color: #0088cc; }
    .instagram { background-color: #E4405F; }
    .copy-link {
      background-color: #555;
    }
    .footer-note {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

<div class="container" id="app">
  
  <!-- ====== لوگوی اپلیکیشن (بالای صفحه) ====== -->
  <img class="app-logo" src="assets/logo.png" alt="آواپاد">
  
  <!-- جلد پادکست -->
  <img id="cover" class="cover" src="https://via.placeholder.com/120/333/666?text=Podcast" alt="جلد پادکست">
  <div class="badge" id="badge">🎙️ پادکست ویژه</div>
  <div class="title" id="title">عنوان پادکست</div>
  <div class="artist" id="artist">نام گوینده</div>
  <div class="desc" id="desc">توضیحات کوتاه درباره این پادکست یا اپیزود...</div>

  <a href="#" id="listenBtn" class="share-btn">▶ گوش دادن در آواپاد</a>

  <div class="social-buttons">
    <a href="#" id="shareWhatsapp" class="whatsapp">واتساپ</a>
    <a href="#" id="shareTelegram" class="telegram">تلگرام</a>
    <a href="#" id="shareInstagram" class="instagram">اینستاگرام</a>
    <a href="#" id="copyLinkBtn" class="copy-link">📋 کپی لینک</a>
  </div>
  <div class="footer-note">ارسال شده از طریق اپلیکیشن آواپاد</div>
</div>

<script>

  const podcastData = {
    "pod_123": {
      title: "پادکست بی‌پلاس",
      artist: "علی بندری",
      description: "هر هفته با یه مهمون جدید، درباره زندگی، تکنولوژی و چالش‌های روزمره.",
      cover: "https://via.placeholder.com/120/4A90E2/FFF?text=BP",
      badge: "🔥 محبوب"
    },
    "pod_456": {
      title: "چند دقیقه با...",
      artist: "میلاد حاتمی",
      description: "داستان‌های کوتاه و شنیدنی از آدم‌های معمولی که کارهای خارق‌العاده می‌کنند.",
      cover: "https://via.placeholder.com/120/E74C3C/FFF?text=MD",
      badge: "⭐ ویژه"
    },
    // پادکست‌های دیگه رو اینجا اضافه کن...
    "default": {
      title: "پادکست آواپاد",
      artist: "گوینده",
      description: "برای دیدن اطلاعات این پادکست، لطفاً اپلیکیشن آواپاد را باز کنید.",
      cover: "https://via.placeholder.com/120/333/666?text=Avapod",
      badge: "🎧 آواپاد"
    }
  };

  // ------------------- خواندن پارامتر از آدرس -------------------
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  const podcastId = getQueryParam('id') || 'default';

  // ------------------- نمایش اطلاعات روی صفحه -------------------
  const data = podcastData[podcastId] || podcastData['default'];

  document.getElementById('title').innerText = data.title;
  document.getElementById('artist').innerText = data.artist;
  document.getElementById('desc').innerText = data.description;
  document.getElementById('cover').src = data.cover;
  document.getElementById('badge').innerText = data.badge;

  // لینک دکمه گوش دادن (به اپلیکیشن)
  // می‌تونی این لینک رو به یه صفحه خاص یا دایرکت مایل به مارکت بدی
  document.getElementById('listenBtn').href = 'https://avapod.com/app?podcast=' + podcastId;

  // ------------------- دکمه‌های اشتراک‌گذاری -------------------
  // لینک فعلی که قراره به اشتراک گذاشته بشه (همون صفحه با پارامتر id)
  const shareUrl = window.location.href;

  document.getElementById('shareWhatsapp').href = 'https://wa.me/?text=' + encodeURIComponent('🎧 به این پادکست گوش بده: ' + shareUrl);
  document.getElementById('shareTelegram').href = 'https://t.me/share/url?url=' + encodeURIComponent(shareUrl) + '&text=' + encodeURIComponent('🎧 به این پادکست گوش بده:');
  document.getElementById('shareInstagram').addEventListener('click', function(e) {
    e.preventDefault();
    alert('لینک کپی شد! می‌تونی توی استوری یا دایرکت اینستاگرامت بذاریش:\n' + shareUrl);
    navigator.clipboard?.writeText(shareUrl);
  });

  document.getElementById('copyLinkBtn').addEventListener('click', function(e) {
    e.preventDefault();
    navigator.clipboard.writeText(shareUrl).then(() => {
      alert('✅ لینک با موفقیت کپی شد!');
    }).catch(() => {
      // اگه کپی خودکار کار نکرد، یه باکس با لینک به کاربر نشون بده
      prompt('لینک رو کپی کن:', shareUrl);
    });
  });
</script>

</body>
</html>
