<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>آواپاد - گوش دادن به پادکست</title>
  <style>
    body { background: #0A0A0A; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    .container { padding: 20px; }
    .listen-btn { background: #4A90E2; color: white; padding: 15px 30px; border-radius: 30px; text-decoration: none; font-weight: bold; display: inline-block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>در حال باز کردن در آواپاد...</h1>
    <p>اگر اپلیکیشن باز نشد، دکمه زیر را بزنید:</p>
    <br>
    <a href="#" id="listenBtn" class="listen-btn">گوش دادن در آواپاد</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const audioB64 = urlParams.get('audio');
    const MARKET_URL = 'https://play.google.com/store/apps/details?id=com.avapod.app';

    if (audioB64) {
      // ساخت دیپ‌لینک اختصاصی که اپ شما متوجهش میشه
      const deepLink = "avapad://play?audio=" + audioB64;
      
      // تلاش برای باز کردن اپلیکیشن
      window.location.href = deepLink;

      // اگر بعد از ۱.۵ ثانیه هنوز در سایت بودیم، یعنی اپ نصب نیست
      setTimeout(() => {
        window.location.href = MARKET_URL;
      }, 1500);
    }

    document.getElementById('listenBtn').addEventListener('click', () => {
      window.location.href = audioB64 ? "avapad://play?audio=" + audioB64 : MARKET_URL;
    });
  </script>
</body>
</html>
