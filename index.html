<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آواپاد - گوش دادن به پادکست</title>
  <style>
    body { 
      background: #0A0A0A; 
      color: white; 
      font-family: 'Tahoma', sans-serif; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      text-align: center; 
      margin: 0;
    }
    .container { padding: 20px; max-width: 400px; }
    .logo { 
      width: 100px; 
      height: 100px; 
      border-radius: 20px; 
      margin-bottom: 20px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    h1 { font-size: 20px; margin-bottom: 10px; }
    p { color: #aaa; margin-bottom: 25px; }
    .listen-btn { 
      background: #4A90E2; 
      color: white; 
      padding: 15px 30px; 
      border-radius: 30px; 
      text-decoration: none; 
      font-weight: bold; 
      display: inline-block;
      transition: transform 0.2s;
    }
    .listen-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <div class="container">
    <!-- اضافه شدن لوگو -->
    <img src="assets/logo.png" alt="آواپاد" class="logo">
    
    <h1>در حال باز کردن در آواپاد...</h1>
    <p>اگر اپلیکیشن به صورت خودکار باز نشد، دکمه زیر را بزنید:</p>
    
    <a href="#" id="listenBtn" class="listen-btn">گوش دادن در آواپاد</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const audioB64 = urlParams.get('audio');
    const MARKET_URL = 'https://play.google.com/store/apps/details?id=com.avapod.app';

    if (audioB64) {
      const deepLink = "avapad://play?audio=" + audioB64;
      
      // تلاش برای باز کردن اپلیکیشن
      window.location.href = deepLink;

      // هدایت به پلی‌استور در صورت عدم نصب
      setTimeout(() => {
        window.location.href = MARKET_URL;
      }, 2000);
    }

    document.getElementById('listenBtn').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = audioB64 ? "avapad://play?audio=" + audioB64 : MARKET_URL;
    });
  </script>
</body>
</html>
